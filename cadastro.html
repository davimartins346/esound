<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | E-Sound</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header>

    <div class="logo">

        <i class="fa-solid fa-guitar"></i>

        <h2>E-Sound</h2>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Iní­cio</a></li>

            <li><a href="catalogo.html">Catálogo</a></li>

        </ul>

    </nav>

</header>

<section class="login-container">

<div class="login-box">

<h1>Criar Conta</h1>

<p>Cadastre-se gratuitamente</p>

<form id="cadastroForm">

<div class="campo">
<label>Nome Completo</label>
<input type="text" id="nome" required>
</div>

<div class="campo">
<label>CPF</label>
<input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
</div>

<div class="campo">
<label>Telefone</label>
<input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000" required>
</div>

<div class="campo">
<label>E-mail</label>
<input type="email" id="email" required>
</div>

<div class="campo">
<label>Endereço</label>
<input type="text" id="endereco" required>
</div>

<div class="campo">
<label>Senha</label>
<input type="password" id="senha" required>
</div>

<div class="campo">
<label>Confirmar Senha</label>
<input type="password" id="confirmarSenha" required>
</div>

<button type="submit">

Cadastrar

</button>

</form>

<div class="cadastro">

Já possui conta?

<a href="login.html">

Entrar

</a>

</div>

</div>

</section>

<script src="js/cadastro.js"></script>

</body>

</html>
