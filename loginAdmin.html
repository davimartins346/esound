<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - E-Sound</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden; /* Remove a rolagem da página */
        }

        .login-container {
            background: white;
            padding: 35px 35px 30px 35px;
            border-radius: 30px; /* Mais arredondado */
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
            max-height: 95vh; /* Limita a altura */
            overflow-y: auto; /* Permite scroll interno se necessário */
        }

        /* Esconde a barra de rolagem interna */
        .login-container::-webkit-scrollbar {
            width: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-container .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 2px;
        }

        .login-container h1 {
            text-align: center;
            color: #1a1a2e;
            font-size: 26px;
            margin-bottom: 2px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff9800;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
            font-size: 13px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-top: 12px;
            display: none;
            font-weight: 500;
            border-left: 4px solid #c62828;
            animation: shake 0.5s ease;
            font-size: 13px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-top: 12px;
            display: none;
            font-weight: 500;
            border-left: 4px solid #2e7d32;
            font-size: 13px;
        }

        .success-message.show {
            display: block;
        }

        .info-box {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 12px;
            margin-top: 16px;
            text-align: center;
            border: 1px dashed #ddd;
        }

        .info-box p {
            color: #666;
            font-size: 12px;
            margin: 3px 0;
        }

        .info-box strong {
            color: #ff9800;
            font-weight: 700;
        }

        .info-box .credentials {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .info-box .cred-item {
            background: white;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 12px;
        }

        .cred-item span {
            font-weight: 700;
            color: #1a1a2e;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 46px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
            color: #888;
            padding: 4px;
        }

        .toggle-btn:hover {
            color: #333;
        }

        .btn-limpar {
            margin-top: 8px;
            padding: 6px 18px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-limpar:hover {
            background: #d32f2f;
            transform: scale(1.02);
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px 20px 20px;
                border-radius: 25px;
                max-width: 100%;
            }
            
            .login-container h1 {
                font-size: 22px;
            }
            
            .login-container .logo {
                font-size: 36px;
            }
            
            .info-box .credentials {
                flex-direction: row;
                gap: 10px;
            }
        }

        /* Para telas muito pequenas */
        @media (max-height: 700px) {
            .login-container {
                padding: 20px 25px 18px 25px;
            }
            
            .login-container .logo {
                font-size: 32px;
            }
            
            .login-container h1 {
                font-size: 20px;
            }
            
            .login-container .subtitle {
                font-size: 11px;
                margin-bottom: 15px;
            }
            
            .form-group {
                margin-bottom: 10px;
            }
            
            .form-group label {
                font-size: 12px;
            }
            
            .form-group input {
                padding: 10px 12px;
                font-size: 13px;
            }
            
            .btn-login {
                padding: 11px;
                font-size: 15px;
            }
            
            .info-box {
                padding: 10px;
                margin-top: 12px;
            }
            
            .info-box p {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🎵</div>
        <h1>E-Sound</h1>
        <p class="subtitle">Área Administrativa</p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="usuario">👤 Usuário</label>
                <input 
                    type="text" 
                    id="usuario" 
                    placeholder="Digite seu usuário" 
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="senha">🔒 Senha</label>
                <div class="password-toggle">
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Digite sua senha" 
                        required
                    >
                    <button type="button" class="toggle-btn" onclick="togglePassword()" id="toggleBtn">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Entrar no Dashboard
            </button>

            <div id="errorMessage" class="error-message">
                ❌ Usuário ou senha incorretos!
            </div>

            <div id="successMessage" class="success-message">
                ✅ Login realizado com sucesso!
            </div>
        </form>

        <div class="info-box">
            <p>🔑 Credenciais de teste:</p>
            <div class="credentials">
                <div class="cred-item">
                    👤 <span>admin</span>
                </div>
                <div class="cred-item">
                    🔑 <span>123456</span>
                </div>
            </div>
            <p style="font-size: 11px; color: #999; margin-top: 4px;">
                Use essas credenciais para acessar o dashboard
            </p>
            <button onclick="limparSessao()" class="btn-limpar">
                🔄 Limpar Sessão
            </button>
        </div>
    </div>

    <script>
        console.log('🔐 Página de Login carregada!');

        // ==========================================
        // VERIFICA SE JÁ ESTÁ LOGADO - REMOVIDO
        // Agora sempre mostra a tela de login
        // ==========================================

        // ==========================================
        // CONFIGURAÇÕES DE USUÁRIOS
        // ==========================================
        const USUARIOS = [
            {
                usuario: 'admin',
                senha: '123456',
                nome: 'Administrador',
                nivel: 'admin'
            },
            {
                usuario: 'gerente',
                senha: 'gerente123',
                nome: 'Gerente',
                nivel: 'gerente'
            },
            {
                usuario: 'vendedor',
                senha: 'vender123',
                nome: 'Vendedor',
                nivel: 'vendedor'
            }
        ];

        // ==========================================
        // ELEMENTOS
        // ==========================================
        const form = document.getElementById('loginForm');
        const usuarioInput = document.getElementById('usuario');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btnLogin');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // ==========================================
        // FUNÇÃO DE LOGIN
        // ==========================================
        function fazerLogin(usuario, senha) {
            const user = USUARIOS.find(u => 
                u.usuario === usuario && u.senha === senha
            );

            if (user) {
                localStorage.setItem('logado', 'true');
                localStorage.setItem('usuario', user.usuario);
                localStorage.setItem('nomeUsuario', user.nome);
                localStorage.setItem('nivel', user.nivel);
                localStorage.setItem('loginTime', Date.now());

                return { success: true, user: user };
            }

            return { success: false };
        }

        // ==========================================
        // EVENTO DO FORMULÁRIO
        // ==========================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const usuario = usuarioInput.value.trim();
            const senha = senhaInput.value.trim();

            if (!usuario || !senha) {
                errorMsg.textContent = '⚠️ Preencha todos os campos!';
                errorMsg.classList.add('show');
                successMsg.classList.remove('show');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = '⏳ Entrando...';

            setTimeout(() => {
                const result = fazerLogin(usuario, senha);

                if (result.success) {
                    successMsg.classList.add('show');
                    errorMsg.classList.remove('show');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    errorMsg.textContent = '❌ Usuário ou senha incorretos!';
                    errorMsg.classList.add('show');
                    successMsg.classList.remove('show');

                    senhaInput.value = '';
                    senhaInput.focus();

                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar no Dashboard';

                    setTimeout(() => {
                        errorMsg.classList.remove('show');
                    }, 3000);
                }
            }, 800);
        });

        // ==========================================
        // FUNÇÃO PARA MOSTRAR/ESCONDER SENHA
        // ==========================================
        function togglePassword() {
            const toggleBtn = document.getElementById('toggleBtn');
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                senhaInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // ==========================================
        // FUNÇÃO PARA LIMPAR SESSÃO
        // ==========================================
        function limparSessao() {
            localStorage.clear();
            alert('🧹 Sessão limpa! Recarregue a página.');
            location.reload();
        }

        // ==========================================
        // ENTER NO CAMPO SENHA SUBMETE O FORM
        // ==========================================
        senhaInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ==========================================
        // LIMPA MENSAGENS AO DIGITAR
        // ==========================================
        usuarioInput.addEventListener('input', function() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        });

        senhaInput.addEventListener('input', function() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        });

        console.log('👤 Usuários disponíveis:', USUARIOS.map(u => u.usuario).join(', '));
        console.log('🔐 Página de login sempre visível!');
    </script>
</body>
</html>
