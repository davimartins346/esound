<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fornecedores | E-Sound</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/fornecedores.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-guitar"></i>
        <h2>E-Sound</h2>
    </div>

    <nav>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>

            <li><a href="catalogo.html">Catálogo</a></li>

            <li><a href="index.html">Loja</a></li>

        </ul>

    </nav>

</header>

<section class="fornecedores">

<h1>Cadastro de Fornecedores</h1>

<form id="formFornecedor">

<input
type="hidden"
id="idFornecedor">

<input
type="text"
id="nome"
placeholder="Nome da Empresa"
required>

<input
type="text"
id="contato"
placeholder="Contato"
required>

<input
type="text"
id="telefone"
placeholder="Telefone"
required>

<input
type="email"
id="email"
placeholder="E-mail"
required>

<input
type="text"
id="cidade"
placeholder="Cidade"
required>

<button>

Salvar

</button>

</form>

<hr>

<input
type="text"
id="pesquisaFornecedor"
placeholder="Pesquisar fornecedor...">

<table>

<thead>

<tr>

<th>Empresa</th>

<th>Contato</th>

<th>Telefone</th>

<th>Email</th>

<th>Cidade</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="listaFornecedores">

</tbody>

</table>

</section>

<script src="js/fornecedores.js"></script>

</body>

</html>
